name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Changed to write to allow minimizing comments
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Hide outdated Claude comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # Get all comments from the PR
          comments=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  comments(first: 100) {
                    nodes {
                      id
                      author {
                        login
                      }
                      isMinimized
                      body
                    }
                  }
                }
              }
            }
          ' -f owner="${REPO_OWNER}" -f name="${REPO_NAME}" -F number="${PR_NUMBER}")

          # Extract comment IDs from github-actions bot that are not already minimized
          comment_ids=$(echo "$comments" | jq -r '
            .data.repository.pullRequest.comments.nodes[] |
            select(.author.login == "github-actions" and .isMinimized == false) |
            .id
          ')

          # Minimize each outdated comment
          if [ -n "$comment_ids" ]; then
            echo "Found outdated Claude comments to hide"
            echo "$comment_ids" | while read -r comment_id; do
              if [ -n "$comment_id" ]; then
                echo "Minimizing comment: $comment_id"
                gh api graphql -f query='
                  mutation($commentId: ID!) {
                    minimizeComment(input: {subjectId: $commentId, classifier: OUTDATED}) {
                      minimizedComment {
                        isMinimized
                      }
                    }
                  }
                ' -f commentId="$comment_id"
              fi
            done
            echo "Finished hiding outdated comments"
          else
            echo "No outdated Claude comments found"
          fi

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

