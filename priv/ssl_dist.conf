%% SSL distribution configuration for Erlang with PSK authentication
%%
%% This file configures TLS for Erlang distribution using Pre-Shared Key (PSK)
%% authentication instead of certificates. Based on zmstone/erlang-psk-example.
%%
%% The PSK secret is retrieved from the CLUSTER_SECRET environment variable
%% via the ssl_psk:lookup/3 function.
%%
%% Security notes:
%% - Uses TLS 1.2 (Erlang doesn't support external PSK for TLS 1.3)
%% - PSK-DHE ciphersuites provide forward secrecy
%% - AEAD (GCM) ciphers for authenticated encryption
%% - Aggressive timeouts (5s) for fast disconnect detection

[
  {server, [
    {user_lookup_fun, {fun ssl_psk:lookup/3, []}},
    {verify, verify_none},
    {versions, ['tlsv1.2']},
    {ciphers, [
      #{key_exchange => dhe_psk, cipher => aes_256_gcm, mac => aead, prf => sha384},
      #{key_exchange => dhe_psk, cipher => aes_128_gcm, mac => aead, prf => sha256}
    ]},
    {send_timeout, 5000},
    {send_timeout_close, true}
  ]},
  {client, [
    {user_lookup_fun, {fun ssl_psk:lookup/3, []}},
    {verify, verify_none},
    {versions, ['tlsv1.2']},
    {ciphers, [
      #{key_exchange => dhe_psk, cipher => aes_256_gcm, mac => aead, prf => sha384},
      #{key_exchange => dhe_psk, cipher => aes_128_gcm, mac => aead, prf => sha256}
    ]},
    {send_timeout, 5000},
    {send_timeout_close, true}
  ]}
].
