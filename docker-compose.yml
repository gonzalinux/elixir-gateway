name: elixirgateway

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - MIX_ENV=${MIX_ENV:-prod}
        - SECRET_KEY_BASE=${SECRET_KEY_BASE}
    env_file:
      - .env
    environment:
      - SITE_ENCRYPT_DB=/etc/elixirgateway/certs
      - JSON_LOG_PATH=/app/logs/app.json.log
    network_mode: host
    volumes:
      - certs:/etc/elixirgateway/certs
      - logs:/app/logs
      - ./dns_providers/cloudflare.ini:/app/certbot/cloudflare.ini:ro
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${HTTP_PORT:-4000}/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.15.0
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - logs:/app/logs:ro
    command: run /etc/alloy/config.alloy
    environment:
      - LOG_AGGREGATOR_URL=${LOG_AGGREGATOR_URL}
      - DEPLOY_ENV=${DEPLOY_ENV}

volumes:
  certs:
    driver: local
  logs:
    driver: local
